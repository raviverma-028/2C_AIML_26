<body>

<h2>Right Pyramid Star Pattern</h2>

<input type="number" id="rows" placeholder="Enter number of rows">
<button onclick="printPattern()">Generate</button>

<pre id="result"></pre>

<script>

function printPattern(){

    let n = Number(document.getElementById("rows").value);

    let pattern = "";

    for(let i=1;i<=n;i++){

        for(let j=1;j<=i;j++){

            pattern += "*";

        }

        pattern += "\n";

    }

    document.getElementById("result").textContent = pattern;

}

</script>
