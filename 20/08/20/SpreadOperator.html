<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>
<body>
    <script>
        let data = [1, 2, 3, 4, 5];
        function sum(...args)
        {
            let sum = 0;
            for (let i in args){
                sum =sum+i;
            } 
            console.log(sum);
        }
        sum(1,2,3);
        sum(...data);
        console.log(...data);
        console.log(...data);
    </script>

</body>
</html>
